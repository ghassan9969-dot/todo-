<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="تطبيق بسيط لإدارة المهام اليومية، يعمل بدون إنترنت">
  <title>قائمة المهام</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23333'/%3E%3Cpath d='M30 52 L45 67 L72 35' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface-2: #2a2a2a;
      --surface-3: #333;
      --border: #444;
      --text: #f0f0f0;
      --text-dim: #999;
      --text-faint: #777;
      --tap: 44px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .container {
      background: var(--surface);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    h1 {
      text-align: center;
      color: var(--text);
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px; /* 16px يمنع تكبير iOS التلقائي عند التركيز — لا تنزّله */
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
      background: var(--surface-2);
      color: var(--text);
    }

    .input-area input::placeholder { color: var(--text-faint); }
    .input-area input:focus { border-color: #888; }

    .input-area button {
      padding: 12px 24px;
      min-height: var(--tap);
      background: var(--surface-3);
      color: var(--text);
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .input-area button:hover { background: var(--border); }
    .input-area button:active { background: #555; }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--surface-3);
    }

    .stats .count {
      color: #ccc;
      font-weight: bold;
      font-size: 14px;
    }

    .stats button {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      padding: 0 10px;
      min-height: var(--tap);
      border-radius: 6px;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .stats button:hover { background: var(--surface-2); }

    .filters {
      display: flex;
      gap: 4px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .filters button {
      flex: 1;
      min-height: var(--tap);
      background: none;
      border: none;
      border-radius: 9px;
      color: var(--text-dim);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .filters button:hover { color: var(--text); }

    .filters button.active {
      background: var(--surface-3);
      color: var(--text);
      font-weight: bold;
    }

    .task-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .task-list::-webkit-scrollbar { width: 6px; }
    .task-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface-2);
      border-radius: 10px;
      margin-bottom: 8px; /* لا تغيّره دون تحديث GAP في الـ JS */
      transition: background 0.3s;
      user-select: none;
      -webkit-touch-callout: none; /* يمنع قائمة iOS عند الضغط المطوّل */
    }

    /* الأنيميشن على المهمة الجديدة فقط، لا على كل القائمة عند كل render */
    .task-item.is-new { animation: slideIn 0.3s ease; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover { background: var(--surface-3); }

    /* البطاقة المرفوعة تتبع الإصبع */
    .task-item.dragging {
      position: relative;
      z-index: 10;
      background: var(--surface-3);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
      touch-action: none;
      cursor: grabbing;
    }

    /* البطاقات الأخرى تفسح المكان */
    .task-item.shifting { transition: transform 0.18s ease; }

    .check {
      flex: none;
      width: var(--tap);
      height: var(--tap);
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .check:hover { background: #3a3a3a; }

    .check span {
      width: 22px;
      height: 22px;
      border: 2px solid #666;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: transparent;
      transition: all 0.2s;
    }

    .task-item.done .check span {
      background: #4a7c59;
      border-color: #4a7c59;
      color: #fff;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      color: var(--text);
      word-break: break-word;
      cursor: pointer;
      padding: 10px 2px;
      user-select: none;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #666;
    }

    .task-edit-input {
      flex: 1;
      min-width: 0;
      font-size: 16px; /* 16px يمنع تكبير iOS */
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      border: 2px solid #666;
      border-radius: 8px;
      padding: 9px 10px;
      outline: none;
    }

    .actions {
      display: flex;
      gap: 2px;
      flex: none;
    }

    .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 17px;
      border-radius: 8px;
      width: var(--tap);
      height: var(--tap);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      color: #ccc;
    }

    .actions .edit-btn:hover { background: #3a3a3a; }
    .actions .delete-btn:hover { background: #3a2a2a; }

    .empty-msg {
      text-align: center;
      color: var(--text-faint);
      padding: 30px 0;
      font-size: 16px;
    }

    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      background: #222;
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .toast-msg {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toast button {
      flex: none;
      background: #3a3a3a;
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      height: 36px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: none;
    }

    .toast.has-action button { display: block; }
    .toast button:hover { background: #4a4a4a; }

    /* ===== الجوال ===== */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .container {
        padding: 22px 16px;
        border-radius: 14px;
      }

      h1 { font-size: 24px; }

      /* لا scroll داخل scroll على الجوال — الصفحة نفسها تتمرّر */
      .task-list {
        max-height: none;
        overflow-y: visible;
      }
    }

    @media (max-width: 360px) {
      .input-area button { padding: 12px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📋 قائمة المهام</h1>
  <p class="subtitle">نظم يومك بكل سهولة</p>

  <div class="input-area">
    <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة..." maxlength="200"
           autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    <button id="addBtn" type="button">إضافة</button>
  </div>

  <div class="stats">
    <span class="count" id="taskCount">لا توجد مهام</span>
    <button id="clearBtn" type="button">🗑️ حذف الكل</button>
  </div>

  <div class="filters" id="filters" hidden>
    <button type="button" data-filter="all" class="active">الكل</button>
    <button type="button" data-filter="active">النشطة</button>
    <button type="button" data-filter="done">المنجزة</button>
  </div>

  <ul class="task-list" id="taskList"></ul>
</div>

<div class="toast" id="toast">
  <span class="toast-msg" id="toastMsg"></span>
  <button id="toastAction" type="button">تراجع</button>
</div>

<script>
  const STORAGE_KEY = 'todoTasks';

  let tasks = [];
  let justAddedId = null;
  let editingId = null;
  let undoHandler = null;
  let filter = 'all'; // all | active | done — لا يُحفظ عمداً حتى لا تفتح القائمة فارغة

  const EMPTY_MSG = {
    all: 'لا توجد مهام بعد ✨',
    active: 'لا توجد مهام نشطة ✨',
    done: 'لا توجد مهام منجزة بعد'
  };

  const CLEAR_LABEL = {
    all: '🗑️ حذف الكل',
    active: '🗑️ حذف النشطة',
    done: '🗑️ حذف المنجزة'
  };

  // المهام المعروضة حالياً — مصدر الحقيقة لكل ما يعتمد على الترتيب المرئي
  function visibleTasks() {
    if (filter === 'active') return tasks.filter((t) => !t.done);
    if (filter === 'done') return tasks.filter((t) => t.done);
    return tasks;
  }

  const $ = (id) => document.getElementById(id);
  const newId = () =>
    (self.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 't' + Date.now() + Math.random().toString(36).slice(2, 8);

  /* ---------- التخزين ---------- */

  function loadTasks() {
    let stored = null;
    try {
      stored = localStorage.getItem(STORAGE_KEY);
    } catch {
      return; // وضع التصفح الخاص أو التخزين محجوب
    }
    if (!stored) return;

    try {
      const parsed = JSON.parse(stored);
      if (!Array.isArray(parsed)) return;
      // migration: المهام القديمة محفوظة بدون id
      const needsMigration = parsed.some((t) => t && !t.id);
      tasks = parsed
        .filter((t) => t && typeof t.text === 'string')
        .map((t) => ({
          id: t.id || newId(),
          text: t.text,
          done: !!t.done,
          createdAt: t.createdAt || Date.now()
        }));
      if (needsMigration) saveTasks(); // ثبّت الـ ids المولّدة مرة واحدة
    } catch {
      tasks = [];
    }
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch {
      showToast('⚠️ تعذّر الحفظ — المساحة ممتلئة أو التخزين محجوب');
    }
  }

  /* ---------- العرض ---------- */

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function render() {
    const list = $('taskList');
    const count = $('taskCount');

    const visible = visibleTasks();

    if (visible.length === 0) {
      list.innerHTML = `<li class="empty-msg">${EMPTY_MSG[filter]}</li>`;
    } else {
      list.innerHTML = visible.map((task) => {
        const cls = ['task-item'];
        if (task.done) cls.push('done');
        if (task.id === justAddedId) cls.push('is-new');

        const body = task.id === editingId
          ? `<input class="task-edit-input" type="text" maxlength="200" value="${escapeHtml(task.text)}" enterkeyhint="done">`
          : `<span class="task-text">${escapeHtml(task.text)}</span>
             <div class="actions">
               <button class="edit-btn" type="button" aria-label="تعديل">✏️</button>
               <button class="delete-btn" type="button" aria-label="حذف">❌</button>
             </div>`;

        return `
          <li class="${cls.join(' ')}" data-id="${task.id}">
            <button class="check" type="button" aria-label="${task.done ? 'إلغاء الإنجاز' : 'تمّت'}"
                    aria-pressed="${task.done}"><span>✔</span></button>
            ${body}
          </li>`;
      }).join('');
    }

    justAddedId = null;

    // العدّاد يعكس كل المهام لا المعروضة فقط
    const done = tasks.filter((t) => t.done).length;
    count.textContent = tasks.length === 0
      ? 'لا توجد مهام'
      : `${done} من ${tasks.length} منجزة`;

    $('filters').hidden = tasks.length === 0;
    $('filters').querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', b.dataset.filter === filter);
    });

    // الزر يحذف ما تراه، ويقول ذلك
    $('clearBtn').textContent = CLEAR_LABEL[filter];
    $('clearBtn').hidden = visible.length === 0;

    if (editingId) {
      const input = document.querySelector('.task-edit-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  }

  /* ---------- العمليات (بالـ id، لا بالـ index) ---------- */

  function addTask() {
    const input = $('taskInput');
    const text = input.value.trim();

    if (!text) {
      showToast('⚠️ الرجاء كتابة المهمة أولاً');
      input.focus();
      return;
    }

    const task = { id: newId(), text, done: false, createdAt: Date.now() };
    tasks.push(task);
    justAddedId = task.id;

    // المهمة الجديدة نشطة دائماً، فلا تتركها مخفية خلف فلتر "المنجزة"
    if (filter === 'done') filter = 'all';
    saveTasks();
    render();
    input.value = '';
    input.focus();
  }

  function toggleDone(id) {
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    task.done = !task.done;
    saveTasks();
    render();
  }

  function deleteTask(id) {
    const index = tasks.findIndex((t) => t.id === id);
    if (index === -1) return;
    const [removed] = tasks.splice(index, 1);
    saveTasks();
    render();
    showToast(`🗑️ حُذفت "${removed.text}"`, () => {
      tasks.splice(index, 0, removed);
      saveTasks();
      render();
    });
  }

  function clearAll() {
    const visible = visibleTasks();
    if (visible.length === 0) return;

    const backup = tasks.slice(); // نسخة كاملة، فالتراجع يرجّع كل شيء
    const doomed = new Set(visible.map((t) => t.id));
    tasks = tasks.filter((t) => !doomed.has(t.id));

    saveTasks();
    render();
    showToast(`🗑️ حُذفت ${visible.length} مهمة`, () => {
      tasks = backup;
      saveTasks();
      render();
    });
  }

  function setFilter(next) {
    if (next === filter) return;
    filter = next;
    render();
  }

  /* ---------- التعديل ---------- */

  function startEdit(id) {
    editingId = id;
    render();
  }

  function commitEdit(value) {
    const task = tasks.find((t) => t.id === editingId);
    editingId = null;
    if (task) {
      const text = value.trim();
      if (text) task.text = text;
    }
    saveTasks();
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  /* ---------- التنبيه + التراجع ---------- */

  function showToast(msg, onUndo) {
    const toast = $('toast');
    $('toastMsg').textContent = msg;
    undoHandler = onUndo || null;
    toast.classList.toggle('has-action', !!onUndo);
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(hideToast, onUndo ? 5000 : 2000);
  }

  function hideToast() {
    $('toast').classList.remove('show');
    undoHandler = null;
  }

  /* ---------- السحب لإعادة الترتيب (ضغطة مطوّلة) ---------- */

  const LONG_PRESS_MS = 400;
  const MOVE_TOLERANCE = 10; // حركة أكبر من هذا قبل الرفع = تمرير، لا سحب
  const GAP = 8;             // = margin-bottom للبطاقة

  let press = null;          // ضغطة قيد الانتظار
  let drag = null;           // سحب جارٍ
  let justDragged = false;

  function cancelPress() {
    if (press) {
      clearTimeout(press.timer);
      press = null;
    }
  }

  function onPointerDown(e) {
    justDragged = false;
    if (editingId || visibleTasks().length < 2) return;
    if (e.button != null && e.button !== 0) return;

    const el = e.target.closest('.task-item');
    if (!el || e.target.closest('button')) return; // الأزرار تحتفظ بوظائفها

    const y = e.clientY;
    press = {
      startX: e.clientX,
      startY: y,
      timer: setTimeout(() => startDrag(el, y), LONG_PRESS_MS)
    };
  }

  function startDrag(el, y) {
    press = null;

    const items = Array.from($('taskList').querySelectorAll('.task-item'));
    const fromIndex = items.indexOf(el);
    if (fromIndex === -1) return;

    const rects = items.map((n) => n.getBoundingClientRect());
    drag = {
      el, items, rects, fromIndex,
      toIndex: fromIndex,
      startY: y,
      height: rects[fromIndex].height
    };

    el.classList.add('dragging');
    items.forEach((n) => { if (n !== el) n.classList.add('shifting'); });
    if (navigator.vibrate) navigator.vibrate(30); // إحساس الالتقاط
  }

  function applyShift() {
    const { items, fromIndex, toIndex, height } = drag;
    const offset = height + GAP;

    items.forEach((n, i) => {
      if (i === fromIndex) return;
      let shift = 0;
      if (toIndex > fromIndex && i > fromIndex && i <= toIndex) shift = -offset;
      else if (toIndex < fromIndex && i >= toIndex && i < fromIndex) shift = offset;
      n.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }

  function onPointerMove(e) {
    if (press) {
      // تحرّك كثير قبل اكتمال الضغطة → المستخدم يمرّر الصفحة
      if (Math.abs(e.clientY - press.startY) > MOVE_TOLERANCE ||
          Math.abs(e.clientX - press.startX) > MOVE_TOLERANCE) cancelPress();
      return;
    }
    if (!drag) return;

    const dy = e.clientY - drag.startY;
    drag.el.style.transform = `translateY(${dy}px)`;

    // الموضع الجديد = كم منتصف بطاقة تجاوزه منتصف البطاقة المسحوبة
    const r = drag.rects[drag.fromIndex];
    const centerY = r.top + r.height / 2 + dy;

    let to = drag.fromIndex;
    while (to < drag.items.length - 1) {
      const n = drag.rects[to + 1];
      if (centerY > n.top + n.height / 2) to++; else break;
    }
    while (to > 0) {
      const n = drag.rects[to - 1];
      if (centerY < n.top + n.height / 2) to--; else break;
    }

    if (to !== drag.toIndex) {
      drag.toIndex = to;
      applyShift();
    }
  }

  function endDrag(commit) {
    if (!drag) { cancelPress(); return; }

    const { el, items, fromIndex, toIndex } = drag;
    el.classList.remove('dragging');
    el.style.transform = '';
    items.forEach((n) => { n.classList.remove('shifting'); n.style.transform = ''; });

    drag = null;
    justDragged = true; // لا تُفسّر نهاية السحب كنقرة

    if (commit && toIndex !== fromIndex) {
      // fromIndex/toIndex مواضع داخل القائمة المعروضة، وقد تكون مُفلترة.
      // نترجمها إلى مواضع حقيقية عبر الـ id حتى لا ينكسر الترتيب مع الفلاتر.
      const visible = visibleTasks();
      const movedId = visible[fromIndex].id;
      const targetId = visible[toIndex].id;

      const from = tasks.findIndex((t) => t.id === movedId);
      const [moved] = tasks.splice(from, 1);

      const target = tasks.findIndex((t) => t.id === targetId);
      tasks.splice(toIndex > fromIndex ? target + 1 : target, 0, moved);

      saveTasks();
      render();
    }
  }

  /* ---------- الأحداث ---------- */

  $('addBtn').addEventListener('click', addTask);

  $('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-filter]');
    if (btn) setFilter(btn.dataset.filter);
  });
  $('clearBtn').addEventListener('click', clearAll);

  $('taskInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  $('toastAction').addEventListener('click', () => {
    if (undoHandler) undoHandler();
    hideToast();
  });

  // event delegation: مستمع واحد يخدم كل المهام
  $('taskList').addEventListener('click', (e) => {
    if (justDragged) { justDragged = false; return; } // نهاية سحب، لا نقرة
    const item = e.target.closest('.task-item');
    if (!item) return;
    const id = item.dataset.id;

    if (e.target.closest('.check')) toggleDone(id);
    else if (e.target.closest('.edit-btn')) startEdit(id);
    else if (e.target.closest('.delete-btn')) deleteTask(id);
    else if (e.target.closest('.task-text')) toggleDone(id);
  });

  $('taskList').addEventListener('keydown', (e) => {
    if (!e.target.classList.contains('task-edit-input')) return;
    if (e.key === 'Enter') commitEdit(e.target.value);
    else if (e.key === 'Escape') cancelEdit();
  });

  $('taskList').addEventListener('focusout', (e) => {
    if (e.target.classList.contains('task-edit-input') && editingId) {
      commitEdit(e.target.value);
    }
  });

  // السحب: البداية على القائمة، والتتبّع على المستند حتى لا ينقطع خارجها
  $('taskList').addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', () => endDrag(true));
  document.addEventListener('pointercancel', () => endDrag(false));

  // امنع تمرير الصفحة أثناء السحب فقط (passive:false شرط لعمل preventDefault)
  $('taskList').addEventListener('touchmove', (e) => {
    if (drag) e.preventDefault();
  }, { passive: false });

  // امنع قائمة السياق التي تظهر مع الضغط المطوّل
  $('taskList').addEventListener('contextmenu', (e) => {
    if (drag || press) e.preventDefault();
  });

  // تمرير الصفحة يلغي الضغطة المنتظرة
  window.addEventListener('scroll', cancelPress, { passive: true });

  /* ---------- الإقلاع ---------- */

  loadTasks();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>

</body>
</html>
